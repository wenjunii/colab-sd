name: Project checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt pip-audit==2.10.1 --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python generate_notebook.py --check
      - run: git diff --check
      - run: python audit_dependencies.py

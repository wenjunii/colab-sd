name: Project checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  workstation-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [krea, ltx]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Import the pinned workstation stack on Windows with CPU wheels only
        run: |
          python - <<'PY'
          import importlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from ltx_setup import setup_environment

          backend = os.environ['BACKEND']
          installer = importlib.import_module(backend + '_setup')
          torch_packages = list(installer.TORCH_PACKAGES) if backend == 'ltx' else [installer.TORCH]
          environment = setup_environment(sys.executable)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-cache-dir',
              '--index-url', 'https://download.pytorch.org/whl/cpu',
              *[pin + '+cpu' for pin in torch_packages]], env=environment, check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-cache-dir',
              '--index-url', 'https://pypi.org/simple', *installer.DEPENDENCIES], env=environment, check=True)
          if backend == 'ltx':
              from ltx_assets import ensure_source
              os.environ['PATH'] = os.defpath
              environment = setup_environment(sys.executable)
              with tempfile.TemporaryDirectory(prefix='colab-sd-win-ltx-') as directory:
                  scratch = Path(directory).resolve()
                  assert scratch.parent == Path(tempfile.gettempdir()).resolve()
                  environment.update(TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
                  source = ensure_source(scratch)
                  wheels = scratch / 'wheels'
                  subprocess.run([sys.executable, '-m', 'pip', 'wheel', '--no-deps', '--no-build-isolation',
                      '--no-cache-dir', '--wheel-dir', str(wheels), str(source / 'packages/ltx-core'),
                      str(source / 'packages/ltx-pipelines')], env=environment, check=True)
                  subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps',
                                  *map(str, wheels.glob('*.whl'))], env=environment, check=True)
                  subprocess.run([sys.executable, '-c', 'import torch, OpenImageIO; '
                      'from ltx_pipelines import DistilledPipeline; '
                      'from ltx_core.quantization.fp8_cast import build_policy; '
                      'assert not torch.cuda.is_available() and torch.version.cuda is None; '
                      'print("Pinned Windows LTX imports passed on CPU")'], env=environment, check=True)
          else:
              subprocess.run([sys.executable, '-B', 'check_krea_imports.py'], env=environment, check=True)
              subprocess.run([sys.executable, '-c', 'import torch, bitsandbytes; '
                  'assert not torch.cuda.is_available() and torch.version.cuda is None; '
                  'print("Windows Krea INT8 library imported on CPU")'], env=environment, check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'check'], env=environment, check=True)
          print('Windows pinned-stack checks passed; disposable source/fixture scratch removed. No models or CUDA installed.')
          PY
  ltx-dependencies:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Resolve LTX dependencies with CPU PyTorch wheels (no installation)
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from ltx_setup import DEPENDENCIES, TORCH_PACKAGES

          # Explicit CPU builds prevent the resolver from fetching CUDA packages.
          # This validates Python 3.13/Linux dependencies, not GPU imports/inference.
          cpu_packages = [pin + '+cpu' for pin in TORCH_PACKAGES]
          with tempfile.TemporaryDirectory(prefix='colab-sd-ltx-resolve-') as directory:
              scratch = Path(directory).resolve()
              assert scratch.parent == Path(tempfile.gettempdir()).resolve()
              environment = {k: v for k, v in os.environ.items() if not k.startswith('PIP_')}
              environment.update(PIP_CONFIG_FILE=os.devnull, TMP=str(scratch), TEMP=str(scratch),
                                 TMPDIR=str(scratch), PYTHONDONTWRITEBYTECODE='1')
              report = scratch / 'report.json'
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--dry-run',
                  '--ignore-installed', '--only-binary=:all:', '--no-cache-dir',
                  '--index-url', 'https://pypi.org/simple',
                  '--extra-index-url', 'https://download.pytorch.org/whl/cpu',
                  '--report', str(report), *cpu_packages, *DEPENDENCIES], env=environment, check=True)
              resolved = {item['metadata']['name'].lower().replace('_', '-'): item['metadata']['version']
                          for item in json.loads(report.read_text())['install']}
              assert all(resolved[name].endswith('+cpu') for name in ('torch', 'torchvision', 'torchaudio'))
              assert not any(name.startswith('nvidia-') for name in resolved)
          print('LTX dependency resolution passed on Python 3.13/Linux; disposable metadata removed.')
          PY
      - name: Build and smoke-import pinned LTX packages without CUDA
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          from ltx_assets import ensure_source
          from ltx_setup import DEPENDENCIES, TORCH_PACKAGES, setup_environment

          build_tool = next(pin for pin in DEPENDENCIES if pin.startswith('uv-build=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-cache-dir', '--no-deps',
                          '--index-url', 'https://pypi.org/simple', build_tool], check=True)
          # Reproduce a notebook that invokes a venv Python without activating it.
          # The installer must expose its scripts directory in the child only.
          os.environ['PATH'] = os.defpath
          environment = setup_environment(sys.executable)
          assert os.environ['PATH'] == os.defpath
          with tempfile.TemporaryDirectory(prefix='colab-sd-ltx-build-') as directory:
              scratch = Path(directory).resolve()
              assert scratch.parent == Path(tempfile.gettempdir()).resolve()
              environment.update(TMP=str(scratch), TEMP=str(scratch), TMPDIR=str(scratch))
              source = ensure_source(scratch)
              wheels = scratch / 'wheels'
              subprocess.run([sys.executable, '-m', 'pip', 'wheel', '--no-deps', '--no-build-isolation',
                  '--no-cache-dir', '--wheel-dir', str(wheels),
                  str(source / 'packages/ltx-core'), str(source / 'packages/ltx-pipelines')],
                  env=environment, check=True)
              assert sorted(path.name for path in wheels.glob('*.whl')) == [
                  'ltx_core-1.6.1-py3-none-any.whl', 'ltx_pipelines-1.6.1-py3-none-any.whl']
              # Exercise the next setup stage too, using the same dependency pins
              # with explicit CPU Torch binaries in this existing CI Python.
              cpu_packages = [pin + '+cpu' for pin in TORCH_PACKAGES]
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-cache-dir',
                  '--index-url', 'https://pypi.org/simple',
                  '--extra-index-url', 'https://download.pytorch.org/whl/cpu',
                  *cpu_packages, *DEPENDENCIES], env=environment, check=True)
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps',
                  *map(str, wheels.glob('*.whl'))], env=environment, check=True)
              subprocess.run([sys.executable, '-m', 'pip', 'check'], env=environment, check=True)
              environment.update(HF_HUB_OFFLINE='1', TRANSFORMERS_OFFLINE='1')
              subprocess.run([sys.executable, '-B', '-c',
                  'import torch; from ltx_pipelines import DistilledPipeline; '
                  'from ltx_core.quantization.fp8_cast import build_policy; '
                  'assert not torch.cuda.is_available(); '
                  'print("Pinned LTX pipeline and FP8 policy imported on CPU")'],
                  env=environment, check=True)
          print('Both pinned LTX wheels built/imported; disposable source/build files removed. No GPU packages or models installed.')
          PY
  waypoint-bootstrap:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Repair a pip-less environment without ensurepip (no GPU packages)
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import subprocess
          import tempfile
          import venv
          from unittest.mock import patch
          from waypoint_setup import ensure_environment

          host_pip = version('pip')
          with tempfile.TemporaryDirectory(prefix='colab-sd-bootstrap-') as directory:
              scratch = Path(directory).resolve()
              assert scratch.parent == Path(tempfile.gettempdir()).resolve()
              environment = scratch / 'pipless-fixture'
              assert environment.resolve().is_relative_to(scratch)
              venv.EnvBuilder(with_pip=False).create(environment)
              with patch.object(venv.EnvBuilder, '_setup_pip', side_effect=AssertionError('ensurepip called')):
                  python, repaired = ensure_environment(environment)
                  assert repaired
                  same_python, repaired_again = ensure_environment(environment)
                  assert python == same_python and not repaired_again
              subprocess.run([str(python), '-I', '-m', 'pip', '--version'], check=True)
              assert version('pip') == host_pip
          print('Python 3.13 bootstrap and reuse passed; disposable fixture removed.')
          PY
  cpu-checks:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt pip-audit==2.10.1 --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Exercise Waypoint SDXL prompt seeds on CPU
        run: python -B check_sdxl_stream.py --waypoint-seeds
      - run: python generate_notebook.py --check
      - name: Exercise SDXL conditioning through the pinned stream core on CPU
        run: python -B check_sdxl_stream.py
      - name: Import pinned Krea HF runtime without GPU packages or weights
        run: python -B check_krea_imports.py
      - name: Check pinned LTX API and weight metadata without GPU packages or weights
        run: python -B check_ltx_imports.py
      - run: git diff --check
      - run: python audit_dependencies.py
